<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MATI Music Stations</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,sans-serif;
background:#080908;
color:#fff
}
header{
position:sticky;
top:0;
z-index:10;
background:#11120f;
border-bottom:1px solid #292b26;
padding:14px 4%;
display:flex;
align-items:center;
justify-content:space-between;
gap:10px
}
.logo{font-size:21px;font-weight:bold}
.logo span{color:#d0aa68}
nav{display:flex;gap:6px;flex-wrap:wrap}
button{
border:0;
border-radius:9px;
padding:10px 13px;
font-weight:bold;
cursor:pointer
}
.gold{background:#d0aa68;color:#111}
.dark{background:#272821;color:#fff}
.red{background:#d9534f;color:#fff}
main{max-width:1150px;margin:auto;padding:25px 4% 100px}
.hero{
background:linear-gradient(135deg,#181a14,#092318);
padding:35px 25px;
border-radius:20px;
margin-bottom:25px
}
.hero h1{font-size:38px;margin:0 0 8px}
.muted{color:#aaa}
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
gap:12px
}
.card{
background:#121310;
border:1px solid #292b26;
border-radius:15px;
padding:15px
}
.station{text-align:center;min-height:90px}
.active{border-color:#d0aa68}
.search{
width:100%;
padding:13px;
border-radius:10px;
border:1px solid #444;
background:#090a09;
color:#fff;
margin:10px 0 18px
}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}
.list{display:grid;gap:12px}
.item{
background:#121310;
border:1px solid #292b26;
border-radius:14px;
padding:12px;
display:grid;
grid-template-columns:70px 1fr auto;
gap:12px;
align-items:center
}
.thumb{
width:70px;
height:70px;
border-radius:9px;
object-fit:cover;
background:#222
}
.title{font-weight:bold}
.small{font-size:13px;color:#aaa;margin-top:5px}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.modal{
display:none;
position:fixed;
inset:0;
background:#000c;
z-index:50;
align-items:center;
justify-content:center;
padding:15px
}
.box{
width:min(780px,100%);
max-height:94vh;
overflow:auto;
background:#121310;
border:1px solid #444;
border-radius:16px;
padding:20px
}
.close{float:right}
input,select,textarea{
width:100%;
padding:11px;
margin:6px 0 12px;
background:#090a09;
border:1px solid #444;
color:#fff;
border-radius:8px
}
label{font-size:13px;color:#d0aa68}
.row{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px
}
.status{color:#d0aa68;margin:8px 0}
.hidden{display:none!important}
.stat{font-size:28px;font-weight:bold;color:#d0aa68}
.adminitem{
border-top:1px solid #292b26;
padding:14px 0
}
.pill{
display:inline-block;
background:#292b26;
border-radius:20px;
padding:4px 8px;
font-size:11px
}
.trending{color:#ffd16e}
.player{
position:fixed;
bottom:0;
left:0;
right:0;
background:#11120f;
border-top:1px solid #333;
padding:8px 4%;
z-index:20
}
.player audio{width:100%}
.player video{width:100%;max-height:55vh}
@media(max-width:700px){
.hero h1{font-size:29px}
.item{grid-template-columns:55px 1fr}
.thumb{width:55px;height:55px}
.item .actions{grid-column:2}
.row{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
<div class="logo">MATI <span>Music Stations</span></div>

<nav>
<button class="dark" id="homeBtn">🏠 Home</button>
<button class="gold" id="submitBtn">📤 Submit</button>
<button class="dark" id="profileBtn">👤 Profile</button>
<button class="dark" id="adminBtn">⚙️ Admin</button>
<button class="dark hidden" id="logoutBtn">Logout</button>
</nav>
</header>

<main>

<section class="hero">
<h1>🎵 MATI Music Stations</h1>
<p class="muted">
গান শুনুন, ভিডিও দেখুন, Artist খুঁজুন এবং আপনার নিজের গান জমা দিন।
</p>
<div id="authInfo" class="status"></div>
</section>

<h2>📻 Stations</h2>

<div class="grid">

<button class="card station active" data-station="ALL">
🔥<br>All
</button>

<button class="card station" data-station="MATI Hits">
🎵<br>MATI Hits
</button>

<button class="card station" data-station="Love">
❤️<br>Love
</button>

<button class="card station" data-station="Islamic">
☪️<br>Islamic
</button>

<button class="card station" data-station="Relax">
🌙<br>Relax
</button>

</div>

<h2>🔎 Search</h2>

<input
id="search"
class="search"
placeholder="গান, Artist বা Genre লিখে খুঁজুন..."
>

<div class="tabs">

<button class="gold" id="songsTab">🎵 Songs</button>
<button class="dark" id="videosTab">🎬 Videos</button>
<button class="dark" id="trendingTab">🔥 Trending</button>
<button class="dark" id="artistsTab">🎤 Artists</button>

</div>

<div id="contentList" class="list">
<div class="muted">Loading...</div>
</div>

</main>

<div class="player">

<audio id="audioPlayer" controls></audio>

<video id="videoPlayer" controls class="hidden"></video>

</div>


<!-- LOGIN -->

<div id="authModal" class="modal">

<div class="box">

<button class="dark close" data-close="authModal">✕</button>

<h2 id="authTitle">👤 Login</h2>

<div id="loginFields">

<label>Email</label>
<input id="loginEmail" type="email">

<label>Password</label>
<input id="loginPass" type="password">

<button class="gold" id="loginBtn">
Login
</button>

<button class="dark" id="registerSwitch">
Create Account
</button>

</div>


<div id="registerFields" class="hidden">

<label>Name</label>
<input id="regName">

<label>Email</label>
<input id="regEmail" type="email">

<label>Password</label>
<input id="regPass" type="password">

<button class="gold" id="registerBtn">
Register
</button>

<button class="dark" id="loginSwitch">
Already have account
</button>

</div>

<div id="authStatus" class="status"></div>

</div>
</div>


<!-- SUBMIT -->

<div id="submitModal" class="modal">

<div class="box">

<button class="dark close" data-close="submitModal">✕</button>

<h2>📤 Submit Song / Video</h2>

<label>Content Type</label>

<select id="subType">

<option value="audio">🎵 Audio</option>
<option value="video">🎬 Video</option>

</select>

<label>Title</label>
<input id="subTitle">

<label>Artist Name</label>
<input id="subArtist">

<label>Genre</label>

<select id="subGenre">
<option>Pop</option>
<option>Love</option>
<option>Islamic</option>
<option>Rock</option>
<option>Folk</option>
<option>Other</option>
</select>

<label>Contact</label>
<input id="subContact">

<label>Lyrics</label>
<textarea id="subLyrics" rows="5"></textarea>

<label>YouTube Link</label>
<input id="subYT">

<label>Facebook Link</label>
<input id="subFB">

<label>Cover Image</label>
<input id="subCover" type="file" accept="image/*">

<label id="mediaLabel">Audio File</label>
<input id="subMedia" type="file" accept="audio/*">

<label>Description</label>
<textarea id="subDesc" rows="3"></textarea>

<button class="gold" id="submitContentBtn">
📤 Submit
</button>

<div id="submitStatus" class="status"></div>

</div>
</div>


<!-- PROFILE -->

<div id="profileModal" class="modal">

<div class="box">

<button class="dark close" data-close="profileModal">✕</button>

<h2>👤 My Profile</h2>

<div id="profileArea"></div>

</div>
</div>


<!-- ARTIST -->

<div id="artistModal" class="modal">

<div class="box">

<button class="dark close" data-close="artistModal">✕</button>

<div id="artistArea"></div>

</div>
</div>


<!-- ADMIN -->

<div id="adminModal" class="modal">

<div class="box">

<button class="dark close" data-close="adminModal">✕</button>

<h2>⚙️ MATI Admin Dashboard</h2>

<div id="adminStats" class="grid"></div>

<h3>📤 Admin Upload</h3>

<label>Type</label>

<select id="aType">
<option value="audio">🎵 Audio</option>
<option value="video">🎬 Video</option>
</select>

<label>Title</label>
<input id="aTitle">

<label>Artist</label>
<input id="aArtist">

<label>Genre</label>

<select id="aGenre">
<option>Pop</option>
<option>Love</option>
<option>Islamic</option>
<option>Rock</option>
<option>Folk</option>
<option>Other</option>
</select>

<label>Station</label>

<select id="aStation">
<option>MATI Hits</option>
<option>Love</option>
<option>Islamic</option>
<option>Relax</option>
</select>

<label>Cover</label>
<input id="aCover" type="file" accept="image/*">

<label>Audio / Video</label>
<input id="aMedia" type="file" accept="audio/*,video/*">

<label>Description</label>
<textarea id="aDesc"></textarea>

<button class="gold" id="adminUpload">
Upload & Publish
</button>

<div id="adminStatus" class="status"></div>

<h3>⏳ Pending Submissions</h3>

<div id="pendingList"></div>

<h3>🎵 Published Content</h3>

<div id="managedList"></div>

</div>
</div>


<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
onAuthStateChanged,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
signOut,
updateProfile
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
getDoc,
doc,
setDoc,
updateDoc,
deleteDoc,
increment,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* FIREBASE */

const firebaseConfig={

apiKey:
"AIzaSyB3lpzDsg3vt8q3M9_WTQDhulr8Zog7EgE",

authDomain:
"mati-music-stations.firebaseapp.com",

projectId:
"mati-music-stations",

storageBucket:
"mati-music-stations.firebasestorage.app",

messagingSenderId:
"585822541386",

appId:
"1:585822541386:web:fc2e620e2ef138e0df78b3",

measurementId:
"G-9E4GYF8YP2"

};

const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

const db=getFirestore(app);


/* CLOUDINARY */

const CLOUD_NAME="rfqua0ll";

const UPLOAD_PRESET="mati_music_upload";

const CLOUD_URL=
`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`;


/* ADMIN */

const ADMIN="matimusic930@gmail.com";


const $=id=>document.getElementById(id);

const show=id=>$(id).style.display="flex";

const hide=id=>$(id).style.display="none";


let currentType="audio";

let currentStation="ALL";

let cache=[];


/* CLOSE */

document
.querySelectorAll("[data-close]")
.forEach(btn=>{
btn.onclick=()=>{
hide(btn.dataset.close);
};
});


/* AUTH */

$("registerSwitch").onclick=()=>{

$("loginFields").classList.add("hidden");

$("registerFields").classList.remove("hidden");

$("authTitle").textContent="👤 Create Account";

};


$("loginSwitch").onclick=()=>{

$("registerFields").classList.add("hidden");

$("loginFields").classList.remove("hidden");

$("authTitle").textContent="👤 Login";

};


/* REGISTER */

$("registerBtn").onclick=async()=>{

try{

const name=$("regName").value.trim();

const email=$("regEmail").value.trim();

const password=$("regPass").value;

if(!name||!email||password.length<6){

throw new Error(
"Name, Email এবং কমপক্ষে ৬ অক্ষরের Password দিন।"
);

}

const result=
await createUserWithEmailAndPassword(
auth,
email,
password
);

await updateProfile(
result.user,
{
displayName:name
}
);

await setDoc(
doc(db,"profiles",result.user.uid),
{
uid:result.user.uid,
name:name,
email:email,
bio:"",
youtube:"",
facebook:"",
createdAt:serverTimestamp()
}
);

hide("authModal");

}catch(e){

$("authStatus").textContent="❌ "+e.message;

}

};


/* LOGIN */

$("loginBtn").onclick=async()=>{

try{

await signInWithEmailAndPassword(
auth,
$("loginEmail").value.trim(),
$("loginPass").value
);

hide("authModal");

}catch(e){

$("authStatus").textContent="❌ "+e.message;

}

};


/* AUTH STATE */

onAuthStateChanged(auth,user=>{

$("logoutBtn")
.classList
.toggle("hidden",!user);

$("authInfo").textContent=
user
?
`Logged in: ${user.displayName||user.email}`
:
"Public Visitor";

loadPublic();

});


/* LOGOUT */

$("logoutBtn").onclick=
()=>signOut(auth);


/* PROFILE */

$("profileBtn").onclick=()=>{

if(auth.currentUser){

show("profileModal");

loadProfile();

}else{

show("authModal");

}

};


/* SUBMIT */

$("submitBtn").onclick=()=>{

if(auth.currentUser){

show("submitModal");

}else{

show("authModal");

}

};


/* ADMIN */

$("adminBtn").onclick=()=>{

if(
auth.currentUser &&
auth.currentUser.email.toLowerCase()===ADMIN
){

show("adminModal");

loadAdmin();

}else{

show("authModal");

}

};


/* CLOUDINARY UPLOAD */

async function cloudUpload(file,status){

status.textContent="☁️ Upload হচ্ছে...";

const form=new FormData();

form.append("file",file);

form.append("upload_preset",UPLOAD_PRESET);

const response=
await fetch(
CLOUD_URL,
{
method:"POST",
body:form
}
);

const data=await response.json();

if(!response.ok){

throw new Error(
data.error?.message ||
"Cloudinary upload failed"
);

}

status.textContent="✅ Upload complete";

return data.secure_url;

}


/* TYPE CHANGE */

$("subType").onchange=()=>{

const video=
$("subType").value==="video";

$("mediaLabel").textContent=
video
?
"Video File"
:
"Audio File";

$("subMedia").accept=
video
?
"video/*"
:
"audio/*";

};


/* USER SUBMIT */

$("submitContentBtn").onclick=async()=>{

if(!auth.currentUser){

show("authModal");

return;

}

const type=$("subType").value;

const title=$("subTitle").value.trim();

const artist=$("subArtist").value.trim();

const media=$("subMedia").files[0];

const cover=$("subCover").files[0];

if(!title||!artist||!media){

$("submitStatus").textContent=
"⚠️ Title, Artist এবং Audio/Video file দিন।";

return;

}

try{

const mediaUrl=
await cloudUpload(
media,
$("submitStatus")
);

let coverUrl="";

if(cover){

coverUrl=
await cloudUpload(
cover,
$("submitStatus")
);

}

await addDoc(
collection(db,"submissions"),
{

uid:auth.currentUser.uid,

email:auth.currentUser.email,

type:type,

title:title,

artist:artist,

genre:$("subGenre").value,

contact:$("subContact").value,

lyrics:$("subLyrics").value,

youtube:$("subYT").value,

facebook:$("subFB").value,

description:$("subDesc").value,

mediaUrl:mediaUrl,

coverUrl:coverUrl,

status:"Pending",

createdAt:serverTimestamp()

}
);

$("submitStatus").textContent=
"✅ সফল! Admin approve করলে গান/ভিডিও প্রকাশ হবে।";

}catch(e){

$("submitStatus").textContent=
"❌ "+e.message;

}

};


/* LOAD CONTENT */

async function getAllContent(){

const snap=
await getDocs(
collection(db,"contents")
);

return snap.docs.map(d=>({
id:d.id,
...d.data()
}));

}


/* PUBLIC */

async function loadPublic(){

if(currentType==="artists"){

loadArtists();

return;

}

let list=
await getAllContent();

if(currentType==="audio"){

list=list.filter(x=>x.type==="audio");

}

if(currentType==="videos"){

list=list.filter(x=>x.type==="video");

}

list=list.filter(x=>x.published===true);

cache=list;

render(list);

}


/* RENDER */

function render(list){

const search=
$("search").value.trim().toLowerCase();

let result=
list.filter(x=>{

const stationOK=
currentStation==="ALL" ||
x.station===currentStation;

const searchOK=
!search ||
`${x.title} ${x.artist} ${x.genre}`
.toLowerCase()
.includes(search);

return stationOK&&searchOK;

});


if(currentType==="trending"){

result.sort(
(a,b)=>
(b.plays||0)-(a.plays||0)
);

}


if(!result.length){

$("contentList").innerHTML=
`<div class="muted">
কোনো Published Content নেই।
</div>`;

return;

}


$("contentList").innerHTML="";


result.forEach(x=>{

const item=
document.createElement("div");

item.className="item";

item.innerHTML=`

<img
class="thumb"
src="${x.coverUrl||""}"
alt=""
>

<div>

<div class="title">

${x.plays>=10
?'<span class="trending">🔥 Trending</span>'
:""}

${escapeHTML(x.title)}

</div>

<div class="small">

🎤 ${escapeHTML(x.artist||"Unknown")}

•

${escapeHTML(x.genre||"")}

•

▶ ${x.plays||0}

•

❤️ ${x.likes||0}

</div>

<div class="small">

${escapeHTML(x.description||"")}

</div>

</div>

<div class="actions">

<button class="gold playBtn">
▶ ${x.type==="video"?"Watch":"Play"}
</button>

<button class="dark likeBtn">
❤️
</button>

<button class="dark favBtn">
⭐
</button>

</div>

`;

item.querySelector(".playBtn")
.onclick=()=>playContent(x);

item.querySelector(".likeBtn")
.onclick=()=>likeContent(x);

item.querySelector(".favBtn")
.onclick=()=>favoriteContent(x);

$("contentList").appendChild(item);

});

}


/* ESCAPE */

function escapeHTML(text){

return String(text||"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* PLAY */

async function playContent(x){

$("audioPlayer").classList.toggle(
"hidden",
x.type!=="audio"
);

$("videoPlayer").classList.toggle(
"hidden",
x.type!=="video"
);

if(x.type==="audio"){

$("audioPlayer").src=x.mediaUrl;

$("audioPlayer").play();

}else{

$("videoPlayer").src=x.mediaUrl;

$("videoPlayer").play();

}

await updateDoc(
doc(db,"contents",x.id),
{
plays:increment(1)
}
);

}


/* LIKE */

async function likeContent(x){

if(!auth.currentUser){

show("authModal");

return;

}

const id=
`${auth.currentUser.uid}_${x.id}`;

const likeRef=
doc(db,"likes",id);

const old=
await getDoc(likeRef);

if(old.exists()){

await deleteDoc(likeRef);

await updateDoc(
doc(db,"contents",x.id),
{
likes:increment(-1)
}
);

}else{

await setDoc(
likeRef,
{
uid:auth.currentUser.uid,
contentId:x.id,
createdAt:serverTimestamp()
}
);

await updateDoc(
doc(db,"contents",x.id),
{
likes:increment(1)
}
);

}

loadPublic();

}


/* FAVORITE */

async function favoriteContent(x){

if(!auth.currentUser){

show("authModal");

return;

}

const id=
`${auth.currentUser.uid}_${x.id}`;

const ref=
doc(db,"favorites",id);

const old=
await getDoc(ref);

if(old.exists()){

await deleteDoc(ref);

alert("⭐ Favorite removed");

}else{

await setDoc(
ref,
{
uid:auth.currentUser.uid,
contentId:x.id,
createdAt:serverTimestamp()
}
);

alert("⭐ Favorite added");

}

}


/* TABS */

$("songsTab").onclick=()=>{

currentType="audio";

loadPublic();

};

$("videosTab").onclick=()=>{

currentType="videos";

loadPublic();

};

$("trendingTab").onclick=()=>{

currentType="trending";

loadPublic();

};

$("artistsTab").onclick=()=>{

currentType="artists";

loadPublic();

};

$("search").oninput=()=>{

if(currentType!=="artists"){

render(cache);

}

};


/* STATIONS */

document
.querySelectorAll(".station")
.forEach(btn=>{

btn.onclick=()=>{

document
.querySelectorAll(".station")
.forEach(x=>
x.classList.remove("active")
);

btn.classList.add("active");

currentStation=
btn.dataset.station;

loadPublic();

};

});


/* PROFILE */

async function loadProfile(){

const user=auth.currentUser;

if(!user)return;

const ref=
await getDoc(
doc(db,"profiles",user.uid)
);

const p=
ref.exists()
?
ref.data()
:
{};

const submissions=
await getDocs(
collection(db,"submissions")
);

const mine=
submissions.docs
.map(d=>d.data())
.filter(x=>x.uid===user.uid);

$("profileArea").innerHTML=`

<div class="card">

<h3>
${escapeHTML(
p.name||user.displayName||"User"
)}
</h3>

<p>
${escapeHTML(user.email)}
</p>

<label>Bio</label>

<textarea id="profileBio">
${escapeHTML(p.bio||"")}
</textarea>

<label>YouTube</label>

<input
id="profileYT"
value="${escapeHTML(p.youtube||"")}"
>

<label>Facebook</label>

<input
id="profileFB"
value="${escapeHTML(p.facebook||"")}"
>

<button class="gold" id="saveProfile">
Save Profile
</button>

</div>

<h3>📤 My Submissions</h3>

${

/* ARTISTS */

async function loadArtists(){

const snap=
await getDocs(
collection(db,"profiles")
);

const q=
$("search").value.trim().toLowerCase();

const artists=
snap.docs
.map(d=>d.data())
.filter(x=>
!q ||
(x.name||"")
.toLowerCase()
.includes(q)
);

$("contentList").innerHTML=
artists.length
?
artists.map(x=>`

<div class="card">

<h3>
🎤 ${escapeHTML(x.name||"Artist")}
</h3>

<p class="muted">
${escapeHTML(x.bio||"")}
</p>

<button
class="gold artistBtn"
data-name="${escapeHTML(x.name||"")}"
>
View Profile
</button>

</div>

`).join("")
:
'<div class="muted">Artist পাওয়া যায়নি।</div>';

document
.querySelectorAll(".artistBtn")
.forEach(btn=>{

btn.onclick=
()=>showArtist(btn.dataset.name);

});

}


/* ARTIST PROFILE */

async function showArtist(name){

const all=
await getAllContent();

const works=
all.filter(
x=>
x.published===true &&
x.artist===name
);

$("artistArea").innerHTML=`

<h2>🎤 ${escapeHTML(name)}</h2>

<h3>Published Works</h3>

${
works.length
?
works.map(x=>`

<div class="adminitem">

<b>
${escapeHTML(x.title)}
</b>

<div class="small">
${escapeHTML(x.type)}
•
▶ ${x.plays||0}
</div>

</div>

`).join("")
:
'<div class="muted">কোনো published work নেই।</div>'
}

`;

show("artistModal");

}


/* ADMIN DASHBOARD */

async function loadAdmin(){

if(
!auth.currentUser ||
auth.currentUser.email.toLowerCase()!==ADMIN
)return;

const users=
await getDocs(
collection(db,"profiles")
);

const contents=
await getAllContent();

const submissions=
await getDocs(
collection(db,"submissions")
);

const pending=
submissions.docs
.filter(
d=>d.data().status==="Pending"
);

$("adminStats").innerHTML=`

<div class="card">
<div class="stat">${users.size}</div>
👤 Users
</div>

<div class="card">
<div class="stat">
${contents.filter(x=>x.type==="audio").length}
</div>
🎵 Songs
</div>

<div class="card">
<div class="stat">
${contents.filter(x=>x.type==="video").length}
</div>
🎬 Videos
</div>

<div class="card">
<div class="stat">${pending.length}</div>
⏳ Pending
</div>

<div class="card">
<div class="stat">
${contents.reduce(
(a,x)=>a+(x.plays||0),0
)}
</div>
▶ Plays
</div>

`;


/* PENDING */

$("pendingList").innerHTML=
pending.length
?
""
:
'<div class="muted">Pending নেই।</div>';

pending.forEach(d=>{

const x=d.data();

const div=
document.createElement("div");

div.className="adminitem";

div.innerHTML=`

<b>${escapeHTML(x.title)}</b>

<div class="small">

🎤 ${escapeHTML(x.artist)}

•

${escapeHTML(x.type)}

•

${escapeHTML(x.email||"")}

</div>

<div class="actions">

<button class="gold approve">
✅ Approve
</button>

<button class="red reject">
❌ Reject
</button>

</div>

`;

div.querySelector(".approve")
.onclick=
()=>approveSubmission(d.id,x);

div.querySelector(".reject")
.onclick=
()=>rejectSubmission(d.id);

$("pendingList")
.appendChild(div);

});


/* PUBLISHED */

$("managedList").innerHTML=
contents.length
?
contents.map(x=>`

<div class="adminitem">

<b>${escapeHTML(x.title)}</b>

<div class="small">

${escapeHTML(x.artist)}

•

${escapeHTML(x.type)}

•

▶ ${x.plays||0}

•

❤️ ${x.likes||0}

</div>

</div>

`).join("")
:
'<div class="muted">Content নেই।</div>';

}


/* APPROVE */

async function approveSubmission(id,x){

await addDoc(
collection(db,"contents"),
{

type:x.type,

title:x.title,

artist:x.artist,

genre:x.genre,

station:
x.genre==="Love"
?
"Love"
:
x.genre==="Islamic"
?
"Islamic"
:
"MATI Hits",

description:x.description||"",

lyrics:x.lyrics||"",

youtube:x.youtube||"",

facebook:x.facebook||"",

coverUrl:x.coverUrl||"",

mediaUrl:x.mediaUrl,

published:true,

plays:0,

likes:0,

uid:x.uid,

createdAt:serverTimestamp()

}
);

await updateDoc(
doc(db,"submissions",id),
{
status:"Approved",
reviewedAt:serverTimestamp()
}
);

alert("✅ Published");

loadAdmin();

loadPublic();

}


/* REJECT */

async function rejectSubmission(id){

await updateDoc(
doc(db,"submissions",id),
{
status:"Rejected",
reviewedAt:serverTimestamp()
}
);

loadAdmin();

}


/* ADMIN UPLOAD */

$("adminUpload").onclick=async()=>{

if(
!auth.currentUser ||
auth.currentUser.email.toLowerCase()!==ADMIN
){

alert("Admin only");

return;

}

const type=$("aType").value;

const title=$("aTitle").value.trim();

const artist=$("aArtist").value.trim();

const media=$("aMedia").files[0];

const cover=$("aCover").files[0];

if(!title||!artist||!media){

$("adminStatus").textContent=
"⚠️ Title, Artist এবং Media দিন।";

return;

}

try{

const mediaUrl=
await cloudUpload(
media,
$("adminStatus")
);

let coverUrl="";

if(cover){

coverUrl=
await cloudUpload(
cover,
$("adminStatus")
);

}

await addDoc(
collection(db,"contents"),
{

type:type,

title:title,

artist:artist,

genre:$("aGenre").value,

station:$("aStation").value,

description:$("aDesc").value,

mediaUrl:mediaUrl,

coverUrl:coverUrl,

published:true,

plays:0,

likes:0,

createdAt:serverTimestamp()

}
);

$("adminStatus").textContent=
"✅ Published Successfully";

loadAdmin();

loadPublic();

}catch(e){

$("adminStatus").textContent=
"❌ "+e.message;

}

};


/* START */

loadPublic();

</script>
