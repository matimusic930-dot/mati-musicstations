<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MATI Music Stations</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: white;
    }

    header {
      padding: 18px 20px;
      background: #151515;
      border-bottom: 1px solid #292929;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    .logo span {
      color: #c7a86b;
    }

    .header-user {
      color: #aaa;
      font-size: 13px;
      display: none;
      max-width: 160px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 25px 18px 100px;
    }

    .hero {
      background: #171717;
      padding: 30px 22px;
      border-radius: 18px;
      margin-bottom: 25px;
    }

    .hero h1 {
      margin-top: 0;
      font-size: 35px;
    }

    .hero p {
      color: #aaa;
      line-height: 1.6;
    }

    button {
      border: none;
      padding: 12px 18px;
      border-radius: 10px;
      background: #c7a86b;
      color: #111;
      font-weight: bold;
      cursor: pointer;
    }

    button.secondary {
      background: #292929;
      color: white;
    }

    .card {
      background: #151515;
      border: 1px solid #292929;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 18px;
    }

    .song {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 14px 0;
      border-bottom: 1px solid #292929;
    }

    .song:last-child {
      border-bottom: none;
    }

    .cover {
      width: 55px;
      height: 55px;
      border-radius: 10px;
      background: #c7a86b;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #111;
      font-size: 24px;
      flex-shrink: 0;
    }

    .song-info {
      flex: 1;
    }

    .song-info h3 {
      margin: 0 0 5px;
    }

    .song-info p {
      margin: 0;
      color: #888;
      font-size: 14px;
    }

    .player {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #151515;
      border-top: 1px solid #292929;
      padding: 13px 18px;
    }

    .player-inner {
      max-width: 900px;
      margin: auto;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .now-playing {
      flex: 1;
    }

    .now-playing small {
      color: #888;
    }

    .upload-box {
      text-align: center;
      padding: 25px;
      border: 1px dashed #555;
      border-radius: 12px;
    }

    footer {
      text-align: center;
      color: #666;
      margin-top: 30px;
    }

    /* Login/Register Modal */

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.78);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 420px;
      background: #171717;
      border: 1px solid #333;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .modal-head h2 {
      margin: 0;
    }

    .close {
      background: transparent;
      color: #aaa;
      font-size: 25px;
      padding: 4px 10px;
    }

    .auth-input {
      width: 100%;
      padding: 13px;
      margin: 7px 0;
      border-radius: 10px;
      border: 1px solid #3a3a3a;
      background: #0e0e0e;
      color: white;
      outline: none;
    }

    .auth-input:focus {
      border-color: #c7a86b;
    }

    .auth-actions {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .auth-actions button {
      flex: 1;
    }

    .auth-message {
      min-height: 20px;
      margin-top: 12px;
      font-size: 14px;
      color: #c7a86b;
    }

    .auth-switch {
      color: #aaa;
      text-align: center;
      margin: 16px 0 0;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      header {
        align-items: flex-start;
      }

      .hero h1 {
        font-size: 29px;
      }

      .auth-actions {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="logo">
    MATI <span>Music Stations</span>
  </div>

  <div style="display:flex;align-items:center;gap:10px;">

    <div id="headerUser" class="header-user"></div>

    <button id="authButton" onclick="openAuth()">
      Login
    </button>

  </div>

</header>


<div class="container">

  <section class="hero">

    <h1>
      Music with Meaning.
    </h1>

    <p>
      MATI Music Stations — একটি নতুন Music Platform,
      যেখানে মানুষ Account তৈরি করে গান শুনতে এবং
      ভবিষ্যতে নিজের গান Upload করতে পারবে।
    </p>

    <button onclick="openAuth()">
      Get Started
    </button>

  </section>
