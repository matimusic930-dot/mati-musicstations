<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MATI Music Stations</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#080908;
  color:#fff;
}

header{
  position:sticky;
  top:0;
  z-index:20;
  background:#11130f;
  border-bottom:1px solid #292d26;
  padding:14px 4%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.logo{
  font-size:21px;
  font-weight:bold;
}

.logo span{
  color:#d6ad62;
}

nav{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

button{
  border:0;
  border-radius:9px;
  padding:10px 13px;
  cursor:pointer;
  font-weight:bold;
}

.gold{
  background:#d6ad62;
  color:#111;
}

.dark{
  background:#292d27;
  color:#fff;
}

.red{
  background:#d94d4d;
  color:#fff;
}

main{
  max-width:1150px;
  margin:auto;
  padding:25px 4% 100px;
}

.hero{
  background:linear-gradient(135deg,#171a14,#09251a);
  padding:35px 25px;
  border-radius:20px;
  margin-bottom:25px;
}

.hero h1{
  margin:0 0 10px;
  font-size:38px;
}

.muted{
  color:#aaa;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:12px;
}

.card{
  background:#121410;
  border:1px solid #292d27;
  border-radius:15px;
  padding:15px;
}

.station{
  text-align:center;
  min-height:90px;
}

.station.active{
  border-color:#d6ad62;
}

.search{
  width:100%;
  padding:13px;
  border-radius:10px;
  border:1px solid #444;
  background:#090a09;
  color:#fff;
  margin:10px 0 18px;
}

.tabs{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:15px;
}

.list{
  display:grid;
  gap:12px;
}

.item{
  background:#121410;
  border:1px solid #292d27;
  border-radius:14px;
  padding:12px;
  display:grid;
  grid-template-columns:70px 1fr auto;
  gap:12px;
  align-items:center;
}

.thumb{
  width:70px;
  height:70px;
  border-radius:9px;
  object-fit:cover;
  background:#222;
}

.title{
  font-weight:bold;
}

.small{
  font-size:13px;
  color:#aaa;
  margin-top:5px;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#000c;
  z-index:50;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.box{
  width:min(800px,100%);
  max-height:94vh;
  overflow:auto;
  background:#121410;
  border:1px solid #444;
  border-radius:16px;
  padding:20px;
}

.close{
  float:right;
}

input,
select,
textarea{
  width:100%;
  padding:11px;
  margin:6px 0 12px;
  background:#090a09;
  border:1px solid #444;
  color:#fff;
  border-radius:8px;
}

textarea{
  resize:vertical;
}

label{
  font-size:13px;
  color:#d6ad62;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.status{
  color:#d6ad62;
  margin:10px 0;
}

.hidden{
  display:none !important;
}

.stat{
  font-size:28px;
  font-weight:bold;
  color:#d6ad62;
}

.adminitem{
  border-top:1px solid #292d27;
  padding:14px 0;
}

.pill{
  display:inline-block;
  background:#292d27;
  border-radius:20px;
  padding:4px 8px;
  font-size:11px;
}

.trending{
  color:#ffd16e;
}

.player{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#11130f;
  border-top:1px solid #333;
  padding:8px 4%;
  z-index:30;
}

.player audio{
  width:100%;
}

.player video{
  width:100%;
  max-height:55vh;
}

.progress{
  width:100%;
  height:8px;
  background:#292d27;
  border-radius:10px;
  overflow:hidden;
  margin:10px 0;
}

.progressBar{
  height:100%;
  width:0%;
  background:#d6ad62;
}

@media(max-width:700px){

  header{
    align-items:flex-start;
    flex-direction:column;
  }

  .hero h1{
    font-size:29px;
  }

  .item{
    grid-template-columns:55px 1fr;
  }

  .thumb{
    width:55px;
    height:55px;
  }

  .item .actions{
    grid-column:2;
  }

  .row{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
getAuth,
onAuthStateChanged,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
signOut,
updateProfile
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
getFirestore,
collection,
addDoc,
getDocs,
getDoc,
doc,
setDoc,
updateDoc,
deleteDoc,
increment,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

apiKey:
"AIzaSyB3lpzDsg3vt8q3M9_WTQDhulr8Zog7EgE",

authDomain:
"mati-music-stations.firebaseapp.com",

projectId:
"mati-music-stations",

storageBucket:
"mati-music-stations.firebasestorage.app",

messagingSenderId:
"585822541386",

appId:
"1:585822541386:web:fc2e620e2ef138e0df78b3",

measurementId:
"G-9E4GYF8YP2"

};


const app =
initializeApp(firebaseConfig);


const auth =
getAuth(app);


const db =
getFirestore(app);


/* =========================
   CLOUDINARY
========================= */

const CLOUD_NAME =
"rfquaOll";

const UPLOAD_PRESET =
"mati_music_upload";


const ADMIN_EMAIL =
"matimusic930@gmail.com";


/* =========================
   HELPERS
========================= */

const $ =
id => document.getElementById(id);


function show(id){

$(id).style.display = "flex";

}


function hide(id){

$(id).style.display = "none";

}


function escapeHTML(value){

return String(value || "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================
   CLOSE MODALS
========================= */

document
.querySelectorAll("[data-close]")
.forEach(button => {

button.onclick = () => {

hide(button.dataset.close);

};

});


/* =========================
   CLOUDINARY UPLOAD
========================= */

function cloudinaryEndpoint(file){

if(
file.type &&
file.type.startsWith("image/")
){

return
`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`;

}

return
`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/upload`;

}


async function uploadToCloudinary(
file,
statusElement,
progressElement
){

if(!file){

throw new Error("File পাওয়া যায়নি।");

}


statusElement.textContent =
"☁️ Cloudinary-তে Upload হচ্ছে...";


if(progressElement){

progressElement.style.width =
"10%";

}


const formData =
new FormData();


formData.append(
"file",
file
);


formData.append(
"upload_preset",
UPLOAD_PRESET
);


const endpoint =
cloudinaryEndpoint(file);


try{

const response =
await fetch(
endpoint,
{
method:"POST",
body:formData
}
);


if(progressElement){

progressElement.style.width =
"70%";

}


const data =
await response.json();


if(!response.ok){

throw new Error(
data.error?.message ||
"Cloudinary upload failed"
);

}


if(!data.secure_url){

throw new Error(
"Cloudinary URL পাওয়া যায়নি।"
);

}


if(progressElement){

progressElement.style.width =
"100%";

}


statusElement.textContent =
"✅ File Upload Complete";


return data.secure_url;


}catch(error){

if(progressElement){

progressElement.style.width =
"0%";

}


console.error(
"Cloudinary error:",
error
);


throw new Error(
"Cloudinary: " +
error.message
);

}

}


/* =========================
   AUTH
========================= */

$("registerSwitch").onclick =
() => {

$("loginFields")
.classList
.add("hidden");

$("registerFields")
.classList
.remove("hidden");

$("authTitle")
.textContent =
"👤 Create Account";

};


$("loginSwitch").onclick =
() => {

$("registerFields")
.classList
.add("hidden");

$("loginFields")
.classList
.remove("hidden");

$("authTitle")
.textContent =
"👤 Login";

};


/* REGISTER */

$("registerBtn").onclick =
async () => {

try{

const name =
$("regName")
.value
.trim();

const email =
$("regEmail")
.value
.trim();

const password =
$("regPass")
.value;


if(!name){

throw new Error(
"নাম দিন।"
);

}


if(!email){

throw new Error(
"Email দিন।"
);

}


if(password.length < 6){

throw new Error(
"Password কমপক্ষে ৬ অক্ষরের হতে হবে।"
);

}


const result =
await createUserWithEmailAndPassword(
auth,
email,
password
);


await updateProfile(
result.user,
{
displayName:name
}
);


await setDoc(
doc(
db,
"profiles",
result.user.uid
),
{

uid:
result.user.uid,

name:name,

email:email,

bio:"",

youtube:"",

facebook:"",

createdAt:
serverTimestamp()

}
);


$("authStatus")
.textContent =
"✅ Account তৈরি হয়েছে।";


setTimeout(
() => hide("authModal"),
800
);


}catch(error){

$("authStatus")
.textContent =
"❌ " + error.message;

}

};


/* LOGIN */

$("loginBtn").onclick =
async () => {

try{

const email =
$("loginEmail")
.value
.trim();

const password =
$("loginPass")
.value;


await signInWithEmailAndPassword(
auth,
email,
password
);


$("authStatus")
.textContent =
"✅ Login successful";


setTimeout(
() => hide("authModal"),
500
);


}catch(error){

$("authStatus")
.textContent =
"❌ " + error.message;

}

};


/* LOGOUT */

$("logoutBtn").onclick =
async () => {

await signOut(auth);

};


/* AUTH STATE */

onAuthStateChanged(
auth,
user => {

if(user){

$("logoutBtn")
.classList
.remove("hidden");

$("authInfo")
.textContent =
"Logged in: " +
(user.displayName || user.email);

}else{

$("logoutBtn")
.classList
.add("hidden");

$("authInfo")
.textContent =
"Public Visitor";

}

loadPublic();

}
);


/* =========================
   SUBMIT OPEN
========================= */

$("submitBtn").onclick =
() => {

if(!auth.currentUser){

show("authModal");

return;

}

show("submitModal");

};


/* =========================
   PROFILE OPEN
========================= */

$("profileBtn").onclick =
() => {

if(!auth.currentUser){

show("authModal");

return;

}

show("profileModal");

loadProfile();

};


/* =========================
   ADMIN OPEN
========================= */

$("adminBtn").onclick =
() => {

if(!auth.currentUser){

show("authModal");

return;

}


if(
auth.currentUser.email.toLowerCase()
!== ADMIN_EMAIL.toLowerCase()
){

alert(
"এই Dashboard শুধু Admin-এর জন্য।"
);

return;

}


show("adminModal");

loadAdmin();

};


/* =========================
   TYPE CHANGE
========================= */

$("subType").onchange =
() => {

const isVideo =
$("subType").value === "video";


$("mediaLabel")
.textContent =
isVideo
?
"Video File"
:
"Audio File";


$("subMedia").accept =
isVideo
?
"video/*"
:
"audio/*";

};


/* =========================
   USER SUBMIT
========================= */

$("submitContentBtn").onclick =
async () => {

if(!auth.currentUser){

show("authModal");

return;

}


const type =
$("subType").value;

const title =
$("subTitle").value.trim();

const artist =
$("subArtist").value.trim();

const mediaFile =
$("subMedia").files[0];

const coverFile =
$("subCover").files[0];


if(!title){

$("submitStatus").textContent =
"⚠️ Title দিন।";

return;

}


if(!artist){

$("submitStatus").textContent =
"⚠️ Artist name দিন।";

return;

}


if(!mediaFile){

$("submitStatus").textContent =
"⚠️ Audio/Video file নির্বাচন করুন।";

return;

}


try{

const mediaUrl =
await uploadToCloudinary(
mediaFile,
$("submitStatus"),
$("submitProgress")
);


let coverUrl = "";


if(coverFile){

coverUrl =
await uploadToCloudinary(
coverFile,
$("submitStatus"),
$("submitProgress")
);

}


await addDoc(
collection(
db,
"submissions"
),
{

uid:
auth.currentUser.uid,

email:
auth.currentUser.email,

type:type,

title:title,

artist:artist,

genre:
$("subGenre").value,

contact:
$("subContact").value.trim(),

lyrics:
$("subLyrics").value,

youtube:
$("subYT").value.trim(),

facebook:
$("subFB").value.trim(),

description:
$("subDesc").value,

mediaUrl:mediaUrl,

coverUrl:coverUrl,

status:"Pending",

createdAt:
serverTimestamp()

}
);


$("submitStatus").textContent =
"✅ Submit সফল হয়েছে! Admin approve করলে প্রকাশ হবে।";


$("subTitle").value = "";
$("subArtist").value = "";
$("subContact").value = "";
$("subLyrics").value = "";
$("subYT").value = "";
$("subFB").value = "";
$("subDesc").value = "";
$("subMedia").value = "";
$("subCover").value = "";


}catch(error){

$("submitStatus").textContent =
"❌ " + error.message;

}

};


/* =========================
   CONTENT LOAD
========================= */

async function getContents(){

const snapshot =
await getDocs(
collection(
db,
"contents"
)
);


return snapshot.docs.map(
document => ({

id:
document.id,

...document.data()

})
);

}


/* =========================
   PUBLIC
========================= */

let mode = "audio";

let station = "ALL";

let cached = [];


async function loadPublic(){

if(mode === "artists"){

await loadArtists();

return;

}


try{

let data =
await getContents();


data =
data.filter(
item =>
item.published === true
);


if(mode === "audio"){

data =
data.filter(
item =>
item.type === "audio"
);

}


if(mode === "videos"){

data =
data.filter(
item =>
item.type === "video"
);

}


if(mode === "trending"){

data.sort(
(a,b) =>
(b.plays || 0)
-
(a.plays || 0)
);

}


cached = data;

renderContents(data);


}catch(error){

$("contentList").innerHTML =
`
<div class="card">
❌ Content load error:
<br>
${escapeHTML(error.message)}
</div>
`;

}

}


/* =========================
   RENDER
========================= */

function renderContents(data){

const search =
$("search")
.value
.trim()
.toLowerCase();


let result =
data.filter(item => {

const stationOK =
station === "ALL" ||
item.station === station;


const text =
`${item.title || ""}
${item.artist || ""}
${item.genre || ""}`
.toLowerCase();


const searchOK =
!search ||
text.includes(search);


return stationOK && searchOK;

});


if(!result.length){

$("contentList").innerHTML =
`
<div class="card muted">
এখন কোনো Published Content নেই।
</div>
`;

return;

}


$("contentList").innerHTML = "";


result.forEach(item => {

const div =
document.createElement("div");


div.className = "item";


const cover =
item.coverUrl ||
"https://via.placeholder.com/150?text=MATI";


div.innerHTML =
`

<img
class="thumb"
src="${cover}"
alt="cover"
>


<div>

<div class="title">

${
(item.plays || 0) >= 10
?
'<span class="trending">🔥 Trending</span>'
:
''
}

${escapeHTML(item.title)}

</div>


<div class="small">

🎤 ${escapeHTML(item.artist || "Unknown")}

•

${escapeHTML(item.genre || "")}

</div>


<div class="small">

▶ ${item.plays || 0}

•

❤️ ${item.likes || 0}

</div>

</div>


<div class="actions">

<button class="gold playButton">
▶ ${item.type === "video" ? "Watch" : "Play"}
</button>

<button class="dark likeButton">
❤️
</button>

<button class="dark favoriteButton">
⭐
</button>

</div>

`;


div.querySelector(".playButton")
.onclick =
() => playContent(item);


div.querySelector(".likeButton")
.onclick =
() => likeContent(item);


div.querySelector(".favoriteButton")
.onclick =
() => favoriteContent(item);


$("contentList")
.appendChild(div);

});

}


/* =========================
   PLAY
========================= */

async function playContent(item){

$("audioPlayer")
.classList
.add("hidden");

$("videoPlayer")
.classList
.add("hidden");


if(item.type === "audio"){

$("audioPlayer").src =
item.mediaUrl;

$("audioPlayer")
.classList
.remove("hidden");

$("audioPlayer").play();


}else{

$("videoPlayer").src =
item.mediaUrl;

$("videoPlayer")
.classList
.remove("hidden");

$("videoPlayer").play();

}


try{

await updateDoc(
doc(
db,
"contents",
item.id
),
{
plays:
increment(1)
}
);

}catch(error){

console.log(
"Play count error:",
error
);

}

}


/* =========================
   LIKE
========================= */

async function likeContent(item){

if(!auth.currentUser){

show("authModal");

return;

}


const likeId =
auth.currentUser.uid +
"_" +
item.id;


const reference =
doc(
db,
"likes",
likeId
);


const old =
await getDoc(reference);


try{

if(old.exists()){

await deleteDoc(reference);


await updateDoc(
doc(
db,
"contents",
item.id
),
{
likes:
increment(-1)
}
);


}else{

await setDoc(
reference,
{

uid:
auth.currentUser.uid,

contentId:
item.id,

createdAt:
serverTimestamp()

}
);


await updateDoc(
doc(
db,
"contents",
item.id
),
{
likes:
increment(1)
}
);

}


await loadPublic();


}catch(error){

alert(
"Like error: " +
error.message
);

}

}


/* =========================
   FAVORITE
========================= */

async function favoriteContent(item){

if(!auth.currentUser){

show("authModal");

return;

}


const favoriteId =
auth.currentUser.uid +
"_" +
item.id;


const reference =
doc(
db,
"favorites",
favoriteId
);


const old =
await getDoc(reference);


if(old.exists()){

await deleteDoc(reference);

alert(
"⭐ Favorite removed"
);

}else{

await setDoc(
reference,
{

uid:
auth.currentUser.uid,

contentId:
item.id,

createdAt:
serverTimestamp()

}
);

alert(
"⭐ Favorite added"
);

}

}

/* =========================
   STATIONS

/* =========================
   PROFILE
========================= */

async function loadProfile(){

const user =
auth.currentUser;


if(!user)return;


const profileRef =
doc(
db,
"profiles",
user.uid
);


const profileSnap =
await getDoc(profileRef);


const profile =
profileSnap.exists()
?
profileSnap.data()
:
{};


const submissionSnap =
await getDocs(
collection(
db,
"submissions"
)
);


const mine =
submissionSnap.docs
.map(d => d.data())
.filter(
item =>
item.uid === user.uid
);


$("profileArea").innerHTML =
`

<div class="card">

<h3>
👤 ${escapeHTML(
profile.name ||
user.displayName ||
"User"
)}
</h3>


<p>
${escapeHTML(user.email)}
</p>


<label>Bio</label>

<textarea id="profileBio">
${escapeHTML(profile.bio || "")}
</textarea>


<label>YouTube</label>

<input
id="profileYT"
value="${escapeHTML(profile.youtube || "")}"
>


<label>Facebook</label>

<input
id="profileFB"
value="${escapeHTML(profile.facebook || "")}"
>


<button
class="gold"
id="saveProfile"
>
Save Profile
</button>

</div>


<h3>
📤 My Submissions
</h3>


${
mine.length
?
mine.map(item => `

<div class="adminitem">

<b>
${escapeHTML(item.title)}
</b>

<div class="small">

🎤 ${escapeHTML(item.artist)}

•

${escapeHTML(item.type)}

•

<span class="pill">
${escapeHTML(item.status)}
</span>

</div>

</div>

`).join("")
:
`
<div class="muted">
এখনো কোনো submission নেই।
</div>
`
}

`;


$("saveProfile").onclick =
async () => {

await updateDoc(
profileRef,
{

bio:
$("profileBio").value,

youtube:
$("profileYT").value,

facebook:
$("profileFB").value

}
);


alert(
"✅ Profile saved"
);

};

}


/* =========================
   ARTISTS
========================= */

async function loadArtists(){

const snapshot =
await getDocs(
collection(
db,
"profiles"
)
);


const search =
$("search")
.value
.trim()
.toLowerCase();


const artists =
snapshot.docs
.map(d => d.data())
.filter(
item =>
!search ||
(item.name || "")
.toLowerCase()
.includes(search)
);


if(!artists.length){

$("contentList").innerHTML =
`
<div class="card muted">
কোনো Artist পাওয়া যায়নি।
</div>
`;

return;

}


$("contentList").innerHTML =
artists.map(
artist =>
`

<div class="card">

<h3>
🎤 ${escapeHTML(
artist.name || "Artist"
)}
</h3>


<p class="muted">
${escapeHTML(
artist.bio || ""
)}
</p>


<button
class="gold artistButton"
data-artist="${escapeHTML(
artist.name || ""
)}"
>
View Profile
</button>

</div>

`
).join("");


document
.querySelectorAll(".artistButton")
.forEach(button => {

button.onclick =
() =>
showArtist(
button.dataset.artist
);

});

}


/* =========================
   ARTIST PROFILE
========================= */

async function showArtist(name){

const contents =
await getContents();


const works =
contents.filter(
item =>
item.published === true &&
item.artist === name
);


$("artistArea").innerHTML =
`

<h2>
🎤 ${escapeHTML(name)}
</h2>


<h3>
Published Songs & Videos
</h3>


${
works.length
?
works.map(item => `

<div class="adminitem">

<b>
${escapeHTML(item.title)}
</b>

<div class="small">

${escapeHTML(item.type)}

•

▶ ${item.plays || 0}

</div>

</div>

`).join("")
:
`
<div class="muted">
এই Artist-এর কোনো published content নেই।
</div>
`
}

`;


show("artistModal");

}


/* =========================
   ADMIN
========================= */

async function loadAdmin(){

if(!auth.currentUser){

return;

}


if(
auth.currentUser.email.toLowerCase()
!==
ADMIN_EMAIL.toLowerCase()
){

return;

}


try{

const users =
await getDocs(
collection(
db,
"profiles"
)
);


const contents =
await getContents();


const submissions =
await getDocs(
collection(
db,
"submissions"
)
);


const pending =
submissions.docs.filter(
doc =>
doc.data().status === "Pending"
);


$("adminStats").innerHTML =
`

<div class="card">

<div class="stat">
${users.size}
</div>

👤 Users

</div>


<div class="card">

<div class="stat">
${
contents.filter(
item =>
item.type === "audio"
).length
}
</div>

🎵 Songs

</div>


<div class="card">

<div class="stat">
${
contents.filter(
item =>
item.type === "video"
).length
}
</div>

🎬 Videos

</div>


<div class="card">

<div class="stat">
${pending.length}
</div>

⏳ Pending

</div>


<div class="card">

<div class="stat">
${
contents.reduce(
(total,item) =>
total + (item.plays || 0),
0
)
}
</div>

▶ Plays

</div>

`;


/* PENDING */

$("pendingList").innerHTML =
"";


if(!pending.length){

$("pendingList").innerHTML =
`
<div class="muted">
Pending নেই।
</div>
`;

}


pending.forEach(documentItem => {

const item =
documentItem.data();


const div =
document.createElement("div");


div.className =
"adminitem";


div.innerHTML =
`

<b>
${escapeHTML(item.title)}
</b>


<div class="small">

🎤 ${escapeHTML(item.artist)}

•

${escapeHTML(item.type)}

•

${escapeHTML(item.email || "")}

</div>


<div class="actions">

<button
class="gold approveButton"
>
✅ Approve
</button>


<button
class="red rejectButton"
>
❌ Reject
</button>

</div>

`;


div.querySelector(".approveButton")
.onclick =
() =>
approveSubmission(
documentItem.id,
item
);


div.querySelector(".rejectButton")
.onclick =
() =>
rejectSubmission(
documentItem.id
);


$("pendingList")
.appendChild(div);

});


/* PUBLISHED */

$("managedList").innerHTML =
contents.length
?
contents.map(
item =>
`

<div class="adminitem">

<b>
${escapeHTML(item.title)}
</b>

<div class="small">

🎤 ${escapeHTML(item.artist)}

•

${escapeHTML(item.type)}

•

▶ ${item.plays || 0}

•

❤️ ${item.likes || 0}

</div>

</div>

`
).join("")
:
`
<div class="muted">
Published content নেই।
</div>
`;


}catch(error){

$("adminStatus").textContent =
"❌ Admin load error: " +
error.message;

}

}


/* =========================
   APPROVE
========================= */

async function approveSubmission(
submissionId,
item
){

try{

await addDoc(
collection(
db,
"contents"
),
{

uid:
item.uid,

type:
item.type,

title:
item.title,

artist:
item.artist,

genre:
item.genre,

station:
item.genre === "Love"
?
"Love"
:
item.genre === "Islamic"
?
"Islamic"
:
"MATI Hits",

lyrics:
item.lyrics || "",

contact:
item.contact || "",

youtube:
item.youtube || "",

facebook:
item.facebook || "",

description:
item.description || "",

mediaUrl:
item.mediaUrl,

coverUrl:
item.coverUrl || "",

published:true,

plays:0,

likes:0,

createdAt:
serverTimestamp()

}
);


await updateDoc(
doc(
db,
"submissions",
submissionId
),
{

status:
"Approved",

reviewedAt:
serverTimestamp()

}
);


alert(
"✅ Content Published"
);


await loadAdmin();

await loadPublic();


}catch(error){

alert(
"Approve Error: " +
error.message
);

}

}


/* =========================
   REJECT
========================= */

async function rejectSubmission(
submissionId
){

try{

await updateDoc(
doc(
db,
"submissions",
submissionId
),
{

status:
"Rejected",

reviewedAt:
serverTimestamp()

}
);


await loadAdmin();


}catch(error){

alert(
"Reject Error: " +
error.message
);

}

}


/* =========================
   ADMIN UPLOAD
========================= */

$("adminUpload").onclick =
async () => {

if(!auth.currentUser){

return;

}


if(
auth.currentUser.email.toLowerCase()
!==
ADMIN_EMAIL.toLowerCase()
){

alert(
"Admin only"
);

return;

}


const type =
$("aType").value;


const title =
$("aTitle").value.trim();


const artist =
$("aArtist").value.trim();


const mediaFile =
$("aMedia").files[0];


const coverFile =
$("aCover").files[0];


if(!title){

$("adminStatus").textContent =
"⚠️ Title দিন।";

return;

}


if(!artist){

$("adminStatus").textContent =
"⚠️ Artist দিন।";

return;

}


if(!mediaFile){

$("adminStatus").textContent =
"⚠️ Audio অথবা Video নির্বাচন করুন।";

return;

}


try{

const mediaUrl =
await uploadToCloudinary(
mediaFile,
$("adminStatus"),
$("adminProgress")
);


let coverUrl = "";


if(coverFile){

coverUrl =
await uploadToCloudinary(
coverFile,
$("adminStatus"),
$("adminProgress")
);

}


await addDoc(
collection(
db,
"contents"
),
{

uid:
auth.currentUser.uid,

type:type,

title:title,

artist:artist,

genre:
$("aGenre").value,

station:
$("aStation").value,

description:
$("aDesc").value,

mediaUrl:
mediaUrl,

coverUrl:
coverUrl,

published:true,

plays:0,

likes:0,

createdAt:
serverTimestamp()

}
);


$("adminStatus").textContent =
"✅ Upload & Publish সফল হয়েছে।";


$("aTitle").value = "";

$("aArtist").value = "";

$("aDesc").value = "";

$("aMedia").value = "";

$("aCover").value = "";


await loadAdmin();

await loadPublic();


}catch(error){

$("adminStatus").textContent =
"❌ " + error.message;

}

};
