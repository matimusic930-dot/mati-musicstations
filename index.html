<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MATI Music Stations</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,sans-serif;
background:#080a08;
color:white;
}
header{
background:#111511;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #333;
position:sticky;
top:0;
z-index:10;
}
.logo{
font-size:22px;
font-weight:bold;
}
.logo span{color:#d8ae5d}
button{
border:0;
padding:10px 14px;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}
.gold{background:#d8ae5d;color:#111}
.dark{background:#292d29;color:white}
.red{background:#d84c4c;color:white}
main{
max-width:1000px;
margin:auto;
padding:25px 15px 100px;
}
.hero{
background:linear-gradient(135deg,#182018,#09271b);
padding:30px;
border-radius:18px;
margin-bottom:25px;
}
.hero h1{margin-top:0}
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:12px;
}
.card{
background:#121612;
border:1px solid #303630;
border-radius:14px;
padding:15px;
}
.station{text-align:center}
.active{border-color:#d8ae5d}
.search{
width:100%;
padding:13px;
background:#090b09;
color:white;
border:1px solid #444;
border-radius:9px;
margin:10px 0 20px;
}
.tabs{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-bottom:15px;
}
.list{display:grid;gap:12px}
.item{
background:#121612;
border:1px solid #303630;
border-radius:14px;
padding:12px;
display:grid;
grid-template-columns:70px 1fr auto;
gap:12px;
align-items:center;
}
.thumb{
width:70px;
height:70px;
object-fit:cover;
border-radius:8px;
background:#222;
}
.title{font-weight:bold}
.small{
font-size:13px;
color:#aaa;
margin-top:5px;
}
.actions{
display:flex;
gap:6px;
flex-wrap:wrap;
}
.modal{
display:none;
position:fixed;
inset:0;
background:#000c;
z-index:50;
align-items:center;
justify-content:center;
padding:15px;
}
.box{
width:min(800px,100%);
max-height:94vh;
overflow:auto;
background:#121612;
border:1px solid #444;
border-radius:16px;
padding:20px;
}
.close{float:right}
input,select,textarea{
width:100%;
padding:11px;
margin:6px 0 12px;
background:#090b09;
border:1px solid #444;
color:white;
border-radius:8px;
}
textarea{resize:vertical}
label{
font-size:13px;
color:#d8ae5d;
}
.row{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}
.status{
color:#d8ae5d;
margin:10px 0;
}
.hidden{display:none!important}
.progress{
width:100%;
height:8px;
background:#292d29;
border-radius:10px;
overflow:hidden;
margin:10px 0;
}
.progressbar{
height:100%;
width:0%;
background:#d8ae5d;
}
.adminitem{
padding:14px 0;
border-top:1px solid #303630;
}
.pill{
background:#292d29;
padding:4px 8px;
border-radius:15px;
font-size:11px;
}
.player{
position:fixed;
bottom:0;
left:0;
right:0;
background:#111511;
border-top:1px solid #333;
padding:8px 15px;
z-index:20;
}
.player audio,
.player video{width:100%}
.stat{
font-size:27px;
font-weight:bold;
color:#d8ae5d;
}
@media(max-width:650px){
header{
flex-direction:column;
align-items:flex-start;
gap:10px;
}
.item{
grid-template-columns:55px 1fr;
}
.thumb{
width:55px;
height:55px;
}
.item .actions{grid-column:2}
.row{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="logo">
MATI <span>Music Stations</span>

<div>
<button class="dark" id="homeBtn">🏠 Home</button>

<button class="dark" id="adminBtn">⚙️ Admin</button>

</header>

<main>

<section class="hero">

<h1>🎵 MATI Music Stations</h1>

<p>
গান শুনুন, ভিডিও দেখুন এবং নিজের গান আপলোড করুন।
</p>

<!-- SUBMIT -->

<div id="submitModal" class="modal">

<button class="dark close" data-close="submitModal">✕</button>

<div id="adminModal" class="modal">

</select>

<input id="aArtist">

<select id="aGenre">

<option>Love</option>

<label>Station</label>

Upload & Publish

<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
onAuthStateChanged,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
signOut,
updateProfile
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
getDoc,
doc,
setDoc,
updateDoc,
deleteDoc,
increment,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* FIREBASE */

const firebaseConfig = {

apiKey:"AIzaSyB3lpzDsg3vt8q3M9_WTQDhulr8Zog7EgE",

authDomain:"mati-music-stations.firebaseapp.com",

projectId:"mati-music-stations",

storageBucket:"mati-music-stations.firebasestorage.app",

messagingSenderId:"585822541386",

appId:"1:585822541386:web:fc2e620e2ef138e0df78b3",

measurementId:"G-9E4GYF8YP2"

};

const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

const db=getFirestore(app);


/* CLOUDINARY */

const CLOUD_NAME="rfqua0ll";

const UPLOAD_PRESET="mati_music_upload";

const ADMIN_EMAIL="matimusic930@gmail.com";


/* HELPERS */

const $=id=>document.getElementById(id);

function show(id){
$(id).style.display="flex";
}

function hide(id){
$(id).style.display="none";
}

function escapeHTML(value){
return String(value||"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}


/* CLOSE */

document.querySelectorAll("[data-close]").forEach(btn=>{
btn.onclick=()=>hide(btn.dataset.close);
});


/* CLOUDINARY ENDPOINT */

function getUploadEndpoint(file){

let resourceType="video";

if(file.type && file.type.startsWith("image/")){
resourceType="image";
}

return `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/${resourceType}/upload`;
}


/* CLOUDINARY UPLOAD */

async function uploadFile(file,status,progress){

if(!file){
throw new Error("File পাওয়া যায়নি");
}

status.textContent="☁️ Upload হচ্ছে...";

progress.style.width="10%";

const form=new FormData();

form.append("file",file);

form.append("upload_preset",UPLOAD_PRESET);

const endpoint=getUploadEndpoint(file);

console.log("Cloudinary endpoint:",endpoint);

try{

const response=await fetch(endpoint,{
method:"POST",
body:form
});

progress.style.width="70%";

const text=await response.text();

let data;

try{

data=JSON.parse(text);

}catch(e){

console.error("Cloudinary response:",text);

throw new Error(
"Cloudinary server response ঠিক নেই। Cloud Name বা Upload URL পরীক্ষা করুন।"
);

}

if(!response.ok){

throw new Error(
data.error?.message ||
"Cloudinary upload failed"
);

}

if(!data.secure_url){

throw new Error(
"Upload URL পাওয়া যায়নি"
);

}

progress.style.width="100%";

status.textContent="✅ Upload complete";

return data.secure_url;

}catch(error){

progress.style.width="0%";

console.error(error);

throw error;

}

}


/* AUTH */

$("registerSwitch").onclick=()=>{

$("loginFields").classList.add("hidden");

$("registerFields").classList.remove("hidden");

$("authTitle").textContent="👤 Create Account";

};


$("loginSwitch").onclick=()=>{

$("registerFields").classList.add("hidden");

$("loginFields").classList.remove("hidden");

$("authTitle").textContent="👤 Login";

};


/* REGISTER */

$("registerBtn").onclick=async()=>{

try{

const name=$("regName").value.trim();

const email=$("regEmail").value.trim();

const password=$("regPass").value;

if(!name)throw new Error("নাম দিন");

if(password.length<6)
throw new Error("Password কমপক্ষে ৬ অক্ষর");

const result=
await createUserWithEmailAndPassword(
auth,email,password
);

await updateProfile(
result.user,
{displayName:name}
);

await setDoc(
doc(db,"profiles",result.user.uid),
{
uid:result.user.uid,
name:name,
email:email,
bio:"",
youtube:"",
facebook:"",
createdAt:serverTimestamp()
}
);

$("authStatus").textContent="✅ Account তৈরি হয়েছে";

setTimeout(()=>hide("authModal"),700);

}catch(error){

$("authStatus").textContent="❌ "+error.message;

}

};


/* LOGIN */

$("loginBtn").onclick=async()=>{

try{

await signInWithEmailAndPassword(
auth,
$("loginEmail").value.trim(),
$("loginPass").value
);

$("authStatus").textContent="✅ Login successful";

setTimeout(()=>hide("authModal"),500);

}catch(error){

$("authStatus").textContent="❌ "+error.message;

}

};


/* LOGOUT */

$("logoutBtn").onclick=async()=>{
await signOut(auth);
};


/* AUTH STATE */

onAuthStateChanged(auth,user=>{

if(user){

$("logoutBtn").classList.remove("hidden");

$("authInfo").textContent=
"Logged in: "+
(user.displayName||user.email);

}else{

$("logoutBtn").classList.add("hidden");

$("authInfo").textContent="Public Visitor";

}

loadPublic();

});


/* SUBMIT OPEN */

$("submitBtn").onclick=()=>{

if(!auth.currentUser){

show("authModal");

return;

}

show("submitModal");

};


/* PROFILE */

$("profileBtn").onclick=()=>{

if(!auth.currentUser){

show("authModal");

return;

}

show("profileModal");

loadProfile();

};


/* ADMIN */

$("adminBtn").onclick=()=>{

if(!auth.currentUser){

show("authModal");

return;

}

if(
auth.currentUser.email.toLowerCase()!==
ADMIN_EMAIL.toLowerCase()
){

alert("শুধু Admin Dashboard ব্যবহার করতে পারবেন");

return;

}

show("adminModal");

loadAdmin();

};


/* TYPE */

$("subType").onchange=()=>{

if($("subType").value==="video"){

$("subMedia").accept="video/*";

}else{

$("subMedia").accept="audio/*";

}

};


/* USER SUBMIT */

$("submitContentBtn").onclick=async()=>{

if(!auth.currentUser){

show("authModal");

return;

}

const type=$("subType").value;

const title=$("subTitle").value.trim();

const artist=$("subArtist").value.trim();

const media=$("subMedia").files[0];

const cover=$("subCover").files[0];

if(!title){

$("submitStatus").textContent="⚠️ Title দিন";

return;

}

if(!artist){

$("submitStatus").textContent="⚠️ Artist Name দিন";

return;

}

if(!media){

$("submitStatus").textContent="⚠️ Audio/Video নির্বাচন করুন";

return;

}

try{

const mediaUrl=
await uploadFile(
media,
$("submitStatus"),
$("submitProgress")
);

let coverUrl="";

if(cover){

coverUrl=
await uploadFile(
cover,
$("submitStatus"),
$("submitProgress")
);

}

await addDoc(
collection(db,"submissions"),
{

uid:auth.currentUser.uid,

email:auth.currentUser.email,

type:type,

title:title,

artist:artist,

genre:$("subGenre").value,

contact:$("subContact").value,

lyrics:$("subLyrics").value,

youtube:$("subYT").value,

facebook:$("subFB").value,

description:$("subDesc").value,

mediaUrl:mediaUrl,

coverUrl:coverUrl,

status:"Pending",

createdAt:serverTimestamp()

}
);

$("submitStatus").textContent=
"✅ গান/ভিডিও সফলভাবে জমা হয়েছে। Admin approve করলে প্রকাশ হবে।";

$("subTitle").value="";
$("subArtist").value="";
$("subContact").value="";
$("subLyrics").value="";
$("subYT").value="";
$("subFB").value="";
$("subDesc").value="";
$("subMedia").value="";
$("subCover").value="";

}catch(error){

$("submitStatus").textContent=
"❌ "+error.message;

}

};


/* CONTENTS */

async function getContents(){

const snap=
await getDocs(
collection(db,"contents")
);

return snap.docs.map(d=>({
id:d.id,
...d.data()
}));

}


/* PUBLIC */

let mode="audio";

let station="ALL";

let cached=[];

async function loadPublic(){

try{

let data=await getContents();

data=data.filter(x=>x.published===true);

if(mode==="audio")
data=data.filter(x=>x.type==="audio");

if(mode==="videos")
data=data.filter(x=>x.type==="video");

if(mode==="trending")
data.sort(
(a,b)=>(b.plays||0)-(a.plays||0)
);

cached=data;

renderContents(data);

}catch(error){

$("contentList").innerHTML=
`
<div class="card">
❌ Content load error
<br>
${escapeHTML(error.message)}
</div>
`;

}

}


/* RENDER */

function renderContents(data){

const search=$("search").value.toLowerCase();

let result=data.filter(item=>{

const stationOK=
station==="ALL"||
item.station===station;

const text=
`${item.title||""} ${item.artist||""} ${item.genre||""}`
.toLowerCase();

return stationOK &&
(!search||text.includes(search));

});

if(!result.length){

$("contentList").innerHTML=
`
<div class="card">
এখন কোনো Published Content নেই।
</div>
`;

return;

}

$("contentList").innerHTML="";

result.forEach(item=>{

const div=document.createElement("div");

div.className="item";

const cover=
item.coverUrl||
"https://via.placeholder.com/150?text=MATI";

div.innerHTML=`

<img
class="thumb"
src="${cover}"
>

<div>

<div class="title">

${
(item.plays||0)>=10
?
"🔥 Trending "
:
""
}

${escapeHTML(item.title)}

</div>

<div class="small">
🎤 ${escapeHTML(item.artist||"Unknown")}
•
${escapeHTML(item.genre||"")}
</div>

<div class="small">
▶ ${item.plays||0}
•
❤️ ${item.likes||0}
</div>

</div>

<div class="actions">

<button class="gold play">
▶ ${item.type==="video"?"Watch":"Play"}
</button>

<button class="dark like">
❤️
</button>

</div>

`;

div.querySelector(".play").onclick=
()=>playContent(item);

div.querySelector(".like").onclick=
()=>likeContent(item);

$("contentList").appendChild(div);

});

}


/* PLAY */

async function playContent(item){

$("audioPlayer").classList.add("hidden");

$("videoPlayer").classList.add("hidden");

if(item.type==="audio"){

$("audioPlayer").src=item.mediaUrl;

$("audioPlayer").classList.remove("hidden");

$("audioPlayer").play();

}else{

$("videoPlayer").src=item.mediaUrl;

$("videoPlayer").classList.remove("hidden");

$("videoPlayer").play();

}

try{

await updateDoc(
doc(db,"contents",item.id),
{plays:increment(1)}
);

}catch(e){

console.log(e);

}

}


/* LIKE */

async function likeContent(item){

if(!auth.currentUser){

show("authModal");

return;

}

const id=
auth.currentUser.uid+"_"+item.id;

const ref=doc(db,"likes",id);

const old=await getDoc(ref);

if(old.exists()){

await deleteDoc(ref);

await updateDoc(
doc(db,"contents",item.id),
{likes:increment(-1)}
);

}else{

await setDoc(
ref,
{
uid:auth.currentUser.uid,
contentId:item.id,
createdAt:serverTimestamp()
}
);

await updateDoc(
doc(db,"contents",item.id),
{likes:increment(1)}
);

}

loadPublic();

}


/* TABS */

/* PROFILE */

async function loadProfile(){

const user=auth.currentUser;

const snap=
await getDoc(
doc(db,"profiles",user.uid)
);

const p=snap.exists()?snap.data():{};

const subs=
await getDocs(
collection(db,"submissions")
);

const mine=
subs.docs
.map(d=>d.data())
.filter(x=>x.uid===user.uid);

$("profileArea").innerHTML=`

<div class="card">

<h3>
👤 ${escapeHTML(
p.name||user.displayName||"User"
)}
</h3>

<p>${escapeHTML(user.email)}</p>

<p>
Bio:
${escapeHTML(p.bio||"")}
</p>

</div>

<h3>📤 My Submissions</h3>

${
mine.length
?
mine.map(x=>`

<div class="adminitem">

<b>${escapeHTML(x.title)}</b>

<div class="small">

🎤 ${escapeHTML(x.artist)}

•

<span class="pill">
${escapeHTML(x.status)}
</span>

</div>

</div>

`).join("")
:
"<div>এখনো কোনো submission নেই।</div>"
}

`;

}


/* ADMIN */

async function loadAdmin(){

const users=
await getDocs(collection(db,"profiles"));

const contents=
await getContents();

const subs=
await getDocs(collection(db,"submissions"));

const pending=
subs.docs.filter(
d=>d.data().status==="Pending"
);

$("adminStats").innerHTML=`

<div class="card">
<div class="stat">${users.size}</div>
👤 Users
</div>

<div class="card">
<div class="stat">
${contents.filter(x=>x.type==="audio").length}
</div>
🎵 Songs
</div>

<div class="card">
<div class="stat">
${contents.filter(x=>x.type==="video").length}
</div>
🎬 Videos
</div>

<div class="card">
<div class="stat">${pending.length}</div>
⏳ Pending
</div>

<div class="card">
<div class="stat">
${contents.reduce((a,x)=>a+(x.plays||0),0)}
</div>
▶ Plays
</div>

`;


/* PENDING */

$("pendingList").innerHTML="";

if(!pending.length){

$("pendingList").innerHTML=
"<div>Pending নেই।</div>";

}

pending.forEach(d=>{

const x=d.data();

const div=document.createElement("div");

div.className="adminitem";

div.innerHTML=`

<b>${escapeHTML(x.title)}</b>

<div class="small">

🎤 ${escapeHTML(x.artist)}

•

${escapeHTML(x.type)}

•

${escapeHTML(x.email||"")}

</div>

<div class="actions">

<button class="gold approve">
✅ Approve
</button>

<button class="red reject">
❌ Reject
</button>

</div>

`;

div.querySelector(".approve").onclick=
()=>approve(d.id,x);

div.querySelector(".reject").onclick=
()=>reject(d.id);

$("pendingList").appendChild(div);

});


/* PUBLISHED */

$("managedList").innerHTML=
contents.length
?
contents.map(x=>`

<div class="adminitem">

<b>${escapeHTML(x.title)}</b>

<div class="small">

🎤 ${escapeHTML(x.artist)}

•

${escapeHTML(x.type)}

•

▶ ${x.plays||0}

</div>

</div>

`).join("")
:
"<div>Published Content নেই।</div>";

}


/* APPROVE */

async function approve(id,x){

try{

await addDoc(
collection(db,"contents"),
{

uid:x.uid,

type:x.type,

title:x.title,

artist:x.artist,

genre:x.genre,

station:
x.genre==="Love"
?"Love":
x.genre==="Islamic"
?"Islamic":
"MATI Hits",

lyrics:x.lyrics||"",

contact:x.contact||"",

youtube:x.youtube||"",

facebook:x.facebook||"",

description:x.description||"",

mediaUrl:x.mediaUrl,

coverUrl:x.coverUrl||"",

published:true,

plays:0,

likes:0,

createdAt:serverTimestamp()

}
);

await updateDoc(
doc(db,"submissions",id),
{
status:"Approved",
reviewedAt:serverTimestamp()
}
);

alert("✅ Published");

loadAdmin();

loadPublic();

}catch(e){

alert("❌ "+e.message);

}

}


/* REJECT */

async function reject(id){

await updateDoc(
doc(db,"submissions",id),
{
status:"Rejected",
reviewedAt:serverTimestamp()
}
);

loadAdmin();

}

/* ADMIN UPLOAD */

$("adminUpload").onclick=async()=>{

if(!auth.currentUser){

return;

}

if(
auth.currentUser.email.toLowerCase()!==
ADMIN_EMAIL.toLowerCase()
){

alert("Admin only");

return;

}

const title=$("aTitle").value.trim();

const artist=$("aArtist").value.trim();

const media=$("aMedia").files[0];

const cover=$("aCover").files[0];

if(!title){

$("adminStatus").textContent="⚠️ Title দিন";

return;

}

if(!artist){

$("adminStatus").textContent="⚠️ Artist দিন";

return;

}

if(!media){

$("adminStatus").textContent="⚠️ Audio/Video নির্বাচন করুন";

return;

}

try{

const mediaUrl=
await uploadFile(
media,
$("adminStatus"),
$("adminProgress")
);

let coverUrl="";

if(cover){

coverUrl=
await uploadFile(
cover,
$("adminStatus"),
$("adminProgress")
);

}

await addDoc(
collection(db,"contents"),
{

uid:auth.currentUser.uid,

type:$("aType").value,

title:title,

artist:artist,

genre:$("aGenre").value,

station:$("aStation").value,

description:$("aDesc").value,

mediaUrl:mediaUrl,

coverUrl:coverUrl,

published:true,

plays:0,

likes:0,

createdAt:serverTimestamp()

}
);

$("adminStatus").textContent=
"✅ Upload & Publish সফল হয়েছে!";

$("aTitle").value="";

$("aArtist").value="";

$("aDesc").value="";

$("aMedia").value="";

$("aCover").value="";

loadAdmin();

loadPublic();

}catch(error){

$("adminStatus").textContent=
"❌ "+error.message;

}

};
